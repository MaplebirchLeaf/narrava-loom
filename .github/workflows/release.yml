name: Release packages

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  game-package:
    name: Grand Tour (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
            executable: target/release/narrava-loom-tauri
          - os: windows-2025
            platform: windows-x86_64
            executable: target/release/narrava-loom-tauri.exe
          - os: macos-15
            platform: macos-arm64
            executable: target/release/narrava-loom-tauri
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux WebView dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Build desktop Host
        run: cargo build --release --locked -p narrava-loom-tauri
      - name: Build portable NarravaGame
        shell: bash
        run: cargo run --locked -p narrava-loom-core -- build examples dist/NarravaGame "${{ matrix.executable }}"
      - name: Archive package
        shell: bash
        run: |
          cd dist
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            7z a "NarravaGame-${{ matrix.platform }}.zip" NarravaGame
          else
            tar -czf "NarravaGame-${{ matrix.platform }}.tar.gz" NarravaGame
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: NarravaGame-${{ matrix.platform }}
          path: dist/NarravaGame-${{ matrix.platform }}.*
          if-no-files-found: error
      - name: Attach tagged release package
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/NarravaGame-${{ matrix.platform }}.*

  vscode-extension:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run vsix
      - uses: actions/upload-artifact@v4
        with:
          name: narrava-loom-twee-vsix
          path: dist/vscode-narrava-loom/*.vsix
          if-no-files-found: error
      - name: Attach tagged release extension
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/vscode-narrava-loom/*.vsix
