<!doctype html>
<!-- Narrava Tauri WebView 的宿主页面骨架。main.js 依赖这里的稳定 id/类名把 Core
     Surface 渲染到对应插槽；作者 CSS 通过 nv-story 上的 --narrava-* token 定制主题。 -->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Narrava</title>
    <link rel="stylesheet" href="main.css" />
    <script src="main.js" defer></script>
  </head>
  <body>
    <nv-story aria-busy="true">
      <!-- 侧栏外壳：ui-bar-toggle 控制收起/展开，bar-surface 承载 Surface bar 区域。 -->
      <nv-ui-bar id="ui-bar" slot="bar">
        <nav id="ui-bar-tray" aria-label="阅读控制">
          <button
            id="history-backward"
            type="button"
            title="返回上一页"
            aria-label="返回上一页"
            disabled
          >
            <svg class="ui-icon" aria-hidden="true" focusable="false" viewBox="0 0 32 32">
              <path d="M14 6 4 16l10 10v-6h12v-8H14V6Z" />
            </svg>
          </button>
          <button
            id="history-forward"
            type="button"
            title="前往下一页"
            aria-label="前往下一页"
            disabled
          >
            <svg class="ui-icon" aria-hidden="true" focusable="false" viewBox="0 0 32 32">
              <path d="M18 6v6H6v8h12v6l10-10L18 6Z" />
            </svg>
          </button>
          <button
            id="ui-bar-toggle"
            type="button"
            title="收起侧栏"
            aria-label="收起侧栏"
            aria-expanded="true"
          >
            <svg
              class="ui-icon icon-collapse"
              aria-hidden="true"
              focusable="false"
              viewBox="0 0 32 32"
            >
              <path d="m21 4-12 12 12 12 4-4-8-8 8-8-4-4Z" />
            </svg>
            <svg
              class="ui-icon icon-expand"
              aria-hidden="true"
              focusable="false"
              viewBox="0 0 32 32"
            >
              <path d="m11 4-4 4 8 8-8 8 4 4 12-12L11 4Z" />
            </svg>
          </button>
        </nav>
        <div id="ui-bar-body">
          <div id="bar-surface"></div>
        </div>
      </nv-ui-bar>
      <!-- 正文插槽：header/main/footer 分别承载对应 Surface 区域。 -->
      <nv-passage tabindex="-1" aria-label="正在启动">
        <header class="passage-header" slot="passage-header"></header>
        <main id="passage-main" class="passage-main" slot="passage-main" aria-live="polite"></main>
        <footer class="passage-footer" slot="passage-footer">
          <div id="passage-footer-surface"></div>
          <span id="status" role="status" aria-live="polite">正在连接 Runtime…</span>
        </footer>
      </nv-passage>
      <!-- 语义 Dialog：页签由 Surface 的顶层标题生成，普通消息走 dialog-message。 -->
      <dialog id="nv-dialog" slot="dialog" aria-label="弹窗">
        <div id="dialog-titlebar">
          <div id="dialog-tabs" role="tablist" aria-label="弹窗页面"></div>
          <form method="dialog">
            <button id="dialog-close" type="submit" aria-label="关闭弹窗" title="关闭弹窗">
              <svg class="ui-icon" aria-hidden="true" focusable="false" viewBox="0 0 32 32">
                <path d="m7 3-4 4 9 9-9 9 4 4 9-9 9 9 4-4-9-9 9-9-4-4-9 9-9-9Z" />
              </svg>
            </button>
          </form>
        </div>
        <div id="dialog-content">
          <div id="dialog-surface"></div>
          <p id="dialog-message"></p>
        </div>
      </dialog>
    </nv-story>
  </body>
</html>
