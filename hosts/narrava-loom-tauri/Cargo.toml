[package]
name = "narrava-loom-tauri"
version = "0.5.3"
edition = "2024"

[build-dependencies]
tauri-build = "2.6.3"

[dependencies]
narrava-loom-core = { path = "../.." }
narrava-loom-protocol = { path = "../../crates/narrava-loom-protocol" }
narrava-loom-script = { path = "../../crates/narrava-loom-script" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = ["devtools", "image-ico", "image-png"] }
tokio = { version = "1", features = ["rt", "time"] }
toml = "0.9"
