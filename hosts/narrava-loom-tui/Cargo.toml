[package]
name = "narrava-loom-tui"
version = "0.5.1"
edition = "2024"

[dependencies]
narrava-loom-core = { path = "../.." }
narrava-loom-protocol = { path = "../../crates/narrava-loom-protocol" } # Runtime/Host 拥有型消息
narrava-loom-script = { path = "../../crates/narrava-loom-script" } # 脚本执行与宏分发
serde_json = "1" # 输入值 JSON 表达
unicode-width = "0.2" # Panel 边框按终端显示宽度对齐 Unicode 文本
