[package]
name = "narrava-loom-protocol" # 跨 Host 的 Surface 传输协议
version = "0.3.0"              # 当前版本
edition = "2024"               # Rust 2024 Edition
description = "Narrava Loom host-neutral surface transport protocol (DTOs and script bridge)"

[dependencies]
narrava-loom-core = { path = "../../" } # 语义类型（Surface 等）与 HostUpdate
serde = { version = "1", features = ["derive"] } # DTO 序列化
serde_json = "1" # SurfaceValue 到 JSON 的受控转换
