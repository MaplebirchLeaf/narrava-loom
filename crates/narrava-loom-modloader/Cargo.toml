[package]
name = "narrava-loom-modloader" # Core 的模组加载器附属 crate
version = "0.2.0"          # 当前版本
edition = "2024"           # Rust 2024 Edition

[dependencies]
narrava-loom-core = { path = "../.." } # 独立 ModLoader 单向依赖 Core
semver = "1" # 语义化版本处理
serde = { version = "1", features = ["derive"] } # 序列化/反序列化
toml = "0.9" # TOML 解析
